omnip:
  outputs:
    dev:
      type: athena
      s3_staging_dir: "{{ env_var('AWS_S3_STAGING_DIR') }}"
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      database: awsdatacatalog
      schema: "{{ env_var('ATHENA_SCHEMA', 'omnip_db_dev') }}"
      workgroup: "{{ env_var('ATHENA_WORKGROUP', 'omnip_dev_workgroup') }}"
      threads: 4
  target: dev
