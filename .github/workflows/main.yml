name: Run NBU Ingestion and dbt

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 17:00 за Києвом (UTC+2)
    - cron: "0 15 * * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Оновлено до v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Кешування шарів Docker значно прискорить повторні запуски
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: nbu-app:latest
          outputs: type=docker,dest=/tmp/nbu-app.tar

      - name: Load Docker image
        run: docker load --input /tmp/nbu-app.tar

      - name: Run Scraper and dbt
        env:
          # Витягуємо секрети GitHub у змінні оточення раннера
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_STAGING_DIR: ${{ secrets.AWS_S3_STAGING_DIR }}
          ATHENA_DATABASE: ${{ secrets.ATHENA_DATABASE }}
          ATHENA_SCHEMA: ${{ secrets.ATHENA_SCHEMA }}
        run: |
          docker run --rm \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_REGION="${{ secrets.AWS_REGION }}" \
            -e AWS_S3_STAGING_DIR="${{ secrets.AWS_S3_STAGING_DIR }}" \
            -e ATHENA_DATABASE="${{ secrets.ATHENA_DATABASE }}" \
            -e ATHENA_SCHEMA="${{ secrets.ATHENA_SCHEMA }}" \
            nbu-app python src/ingest_nbu_rates.py
